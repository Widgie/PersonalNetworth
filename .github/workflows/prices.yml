name: Fetch prices

on:
  workflow_dispatch:
  schedule:
    # UK funds price once a day; run after typical publication. Times are UTC.
    - cron: "17 7 * * 1-6"
    - cron: "17 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pure functions
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.mjs
      - name: Fetch prices
        run: python scripts/fetch_prices.py >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch price history
        run: python scripts/fetch_history.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update prices"
          git push
