<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Net Worth</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Net Worth">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=JSON.parse(localStorage.getItem("nw.store.v1")||"{}").theme||"dark";if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Hanken";src:url(fonts/sans.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(fonts/serif.woff2) format("woff2");font-weight:400;font-display:swap}
:root,[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000;--card:#0c0c0d;--raise:#161618;--ink:#f3f1ec;--ink2:#a3a39c;--muted:#6e6e68;--line:#1f1f21;--line2:#2c2c2f;
  --pos:#4cc38a;--neg:#f0605d;--warn:#e7b04a;--warnbg:#1c1708;--accent:#f3f1ec;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#fbfaf7;--card:#fff;--raise:#f1f0ec;--ink:#121212;--ink2:#55554f;--muted:#86867f;--line:#e8e6e0;--line2:#d9d7d0;
  --pos:#0f7b45;--neg:#c2312e;--warn:#8a5a00;--warnbg:#fbf1d9;--accent:#121212;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 "Hanken",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;
  font-feature-settings:"tnum" 1,"lnum" 1}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:10px 18px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* headings: sentence case, quiet */
h1{font-size:15px;font-weight:500;color:var(--ink2);margin:14px 0 4px}
h2{font-size:15px;font-weight:600;margin:30px 0 6px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 > span:last-child{color:var(--ink2);font-weight:500;font-size:14px}

/* hero: the one loud thing */
.hero{padding:6px 0 4px}
.hero .big{font-family:"Instrument Serif",Georgia,serif;font-size:64px;line-height:1;letter-spacing:-.01em;font-weight:400;margin:2px 0 10px;font-variant-numeric:lining-nums}
.hero .sub{color:var(--ink2);font-size:14px;margin-top:2px}

/* lists: hairlines, no boxes */
.card{background:transparent;border-top:1px solid var(--line);border-radius:0}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-height:60px}
.row.tap{cursor:pointer}.row.tap:active{background:var(--raise)}
.row .l{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .v{text-align:right;font-weight:600;white-space:nowrap}
.row .v .m{font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:4px;background:var(--warnbg);color:var(--warn);margin-left:5px;vertical-align:1px}
.pill{display:inline-block;font-size:11px;font-weight:600;color:var(--ink2);border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin-right:6px}
.note{font-size:13px;color:var(--muted);margin:10px 0;line-height:1.5}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}

/* chart block sits on the page, not in a box */
.chartcard{margin-top:18px;padding:0}
.chartcard .lab{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.chartcard > .lab:first-child{color:var(--ink2)}
.readout{margin:4px 0 8px}
.readout .p{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.readout .c{font-size:15px;font-weight:600}
.readout .d{font-size:13px;color:var(--muted)}
.lc{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:0 -4px}
.lc svg{display:block;width:100%;overflow:visible}
.lc .xh{stroke:var(--ink2);stroke-width:1;opacity:0}
.lc .dot{opacity:0}
.lc.scrub .xh,.lc.scrub .dot{opacity:1}
.lc text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}

/* segmented ranges: text, white pill when selected */
.seg{display:flex;gap:2px;margin:10px 0 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink2);border-radius:9px;padding:8px 0;font-size:14px;font-weight:600}
.seg.small button{padding:7px 0;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}

/* asset switcher */
.chips{position:sticky;top:0;z-index:4;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -18px 0;padding:10px 18px;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.key{width:9px;height:9px;border-radius:50%;flex:none}

.alloc{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:14px 0 2px}
.alloc i{display:block;height:100%}

/* stats: a ruled grid, not tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-top:1px solid var(--line)}
.stat{padding:12px 0;border-bottom:1px solid var(--line)}
.stat:nth-child(odd):not(.wide){padding-right:12px}
.stat:nth-child(even):not(.wide){padding-left:12px;border-left:1px solid var(--line)}
.stat .k{font-size:13px;color:var(--muted)}.stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.wide{grid-column:1/-1}
.stat.wide ~ .stat{padding-left:0 !important;border-left:0 !important}

.moves{margin-top:14px;border-top:1px solid var(--line)}
.move{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.move .mt{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.move .mt .d{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.move .md{font-size:13px;color:var(--muted);margin-top:3px}
.mdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.chg{font-size:13px;font-weight:600}
.spark{width:60px;height:26px;flex:none}

/* detail header */
.top{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.back{background:none;border:0;color:var(--ink2);font-size:15px;font-weight:500;padding:8px 8px 8px 0}
.title{font-family:"Instrument Serif",Georgia,serif;font-size:32px;line-height:1.1;margin:4px 0 6px;font-weight:400}
.subt{font-size:13px;color:var(--muted)}

/* buttons & forms */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:600;background:var(--ink);color:var(--bg);margin:8px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--line2)}
details{margin-top:18px}summary{color:var(--ink2);cursor:pointer;padding:8px 0}
dialog{border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;background:var(--card);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
.sheet{padding:18px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;max-height:88vh}
.sheet h3{margin:0 0 12px;font-size:19px;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-weight:500}
th{color:var(--muted)}
th:first-child,td:first-child{text-align:left}
td.num,th.num{white-space:nowrap}
.themes{display:flex;gap:2px}

/* bottom bar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;justify-content:center;gap:40px;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:10px 18px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"></nav>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
